<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogo do Alfabeto</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#8fd3ff,#fff6a8);text-align:center;margin:0;padding:20px}
h1{color:#ff4081}
#target{font-size:40px;font-weight:bold;color:#1565c0;margin:20px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:700px;margin:auto}
button{font-size:28px;padding:15px;border-radius:12px;border:none;background:#4caf50;color:#fff;cursor:pointer}
#msg{font-size:28px;margin:20px;font-weight:bold}
</style>
</head>
<body>
<h1>🌈 Jogo do Alfabeto</h1>
<p>Clique na letra pedida.</p>
<div id="target"></div>
<div id="msg"></div>
<div class="grid" id="grid"></div>
<script>
const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let atual="";
const synth=window.speechSynthesis;
function fala(t){ if(synth){ synth.speak(new SpeechSynthesisUtterance(t)); } }
function nova(){
  atual=letras[Math.floor(Math.random()*letras.length)];
  document.getElementById("target").textContent="Encontre a letra: "+atual;
  document.getElementById("msg").textContent="";
  fala(atual);
}
const grid=document.getElementById("grid");
letras.forEach(l=>{
 const b=document.createElement("button");
 b.textContent=l;
 b.onclick=()=>{
   if(l===atual){
     document.getElementById("msg").textContent="🎉 Muito bem!";
     fala("Muito bem");
     setTimeout(nova,1200);
   }else{
     document.getElementById("msg").textContent="😊 Tente novamente!";
     fala("Tente novamente");
   }
 };
 grid.appendChild(b);
});
nova();
</script>
</body>
</html>
